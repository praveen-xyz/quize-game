<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz Application</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #faf3e1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .quiz-container {
        background: #fff;
        width: 360px;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        margin-bottom: 10px;
      }

      #timer {
        color: #ff6d1f;
      }

      #question {
        margin: 15px 0;
        font-size: 18px;
      }

      #options button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: none;
        border-radius: 8px;
        background: #f5e7c6;
        cursor: pointer;
        transition: 0.3s;
      }

      #options button:hover {
        background: #ff6d1f;
        color: #fff;
      }

      .correct {
        background: #4caf50 !important;
        color: #fff;
      }

      .wrong {
        background: #e53935 !important;
        color: #fff;
      }

      #next-btn {
        margin-top: 10px;
        padding: 10px;
        width: 100%;
        background: #222222;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: none;
      }

      .hide {
        display: none;
      }

      #result-box p {
        margin: 10px 0;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="quiz-container">
      <h1>Quiz App</h1>

      <div id="quiz-box">
        <div class="top-bar">
          <span id="question-number">Question 1/5</span>
          <span id="timer">⏱ 15s</span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next-btn">Next</button>
      </div>

      <div id="result-box" class="hide">
        <h2>Quiz Result</h2>
        <p id="score-text"></p>
        <p id="accuracy-text"></p>
        <button onclick="location.reload()">Restart Quiz</button>
      </div>
    </div>

    <script>
      const questions = [
        {
          question: "What does HTML stand for?",
          options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyperlinks Text Mark Language",
            "None",
          ],
          answer: 0,
        },
        {
          question: "Which language is used for styling web pages?",
          options: ["HTML", "JQuery", "CSS", "XML"],
          answer: 2,
        },
        {
          question: "Which is not a JavaScript framework?",
          options: ["React", "Angular", "Vue", "Django"],
          answer: 3,
        },
        {
          question: "Which symbol is used for JavaScript comments?",
          options: ["<!-- -->", "//", "**", "#"],
          answer: 1,
        },
        {
          question: "Which method converts JSON to object?",
          options: [
            "JSON.parse()",
            "JSON.stringify()",
            "JSON.convert()",
            "JSON.object()",
          ],
          answer: 0,
        },
      ];

      // Randomize questions
     questions.sort(() => Math.random() - 0.5);

      let currentIndex = 0;
      let score = 0;
      let timer;
      let timeLeft = 15;

      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const timerEl = document.getElementById("timer");
      const nextBtn = document.getElementById("next-btn");
      const qNumber = document.getElementById("question-number");

      function loadQuestion() {
        resetState();
        startTimer();

        const q = questions[currentIndex];
        qNumber.textContent = `Question ${currentIndex + 1}/${
          questions.length
        }`;
        questionEl.textContent = q.question;

        q.options.forEach((option, index) => {
          const btn = document.createElement("button");
          btn.textContent = option;
          btn.onclick = () => selectAnswer(index, btn);
          optionsEl.appendChild(btn);
        });
      }

      function selectAnswer(selected, btn) {
        clearInterval(timer);
        const correct = questions[currentIndex].answer;

        Array.from(optionsEl.children).forEach((b) => (b.disabled = true));

        if (selected === correct) {
          btn.classList.add("correct");
          score++;
        } else {
          btn.classList.add("wrong");
          optionsEl.children[correct].classList.add("correct");
        }

        nextBtn.style.display = "block";
      }

      function startTimer() {
        timeLeft = 15;
        timerEl.textContent = `⏱ ${timeLeft}s`;

        timer = setInterval(() => {
          timeLeft--;
          timerEl.textContent = `⏱ ${timeLeft}s`;

          if (timeLeft === 0) {
            clearInterval(timer);
            nextBtn.style.display = "block";
          }
        }, 1000);
      }

      function resetState() {
        clearInterval(timer);
        optionsEl.innerHTML = "";
        nextBtn.style.display = "none";
      }

      nextBtn.addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < questions.length) {
          loadQuestion();
        } else {
          showResult();
        }
      });

      function showResult() {
        document.getElementById("quiz-box").classList.add("hide");
        document.getElementById("result-box").classList.remove("hide");

        const accuracy = ((score / questions.length) * 100).toFixed(0);
        document.getElementById(
          "score-text"
        ).textContent = `Score: ${score} / ${questions.length}`;
        document.getElementById(
          "accuracy-text"
        ).textContent = `Accuracy: ${accuracy}%`;
      }

      loadQuestion(); 
    </script>
  </body>
</html>
